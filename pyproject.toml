[project]
name = "llmgate"
version = "0.1.0"
description = "Terminal LLM API Gateway"
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0.0",
    "httpx>=0.28.0",
    "uvicorn>=0.34.0",
    "starlette>=0.42.0",
    "cryptography>=44.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
llmgate = "llmgate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmgate"]
