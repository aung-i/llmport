[project]
name = "llmport"
version = "0.1.0"
description = "Terminal LLM API Gateway"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0.0",
    "httpx>=0.28.0",
    "uvicorn>=0.34.0",
    "starlette>=0.42.0",
    "cryptography>=44.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
llmport = "llmport.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmport"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
]

[tool.coverage.run]
source = ["src/llmport"]
branch = true
omit = ["src/llmport/__main__.py", "src/llmport/cli.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/llmport --cov-report=term-missing --cov-fail-under=85"
